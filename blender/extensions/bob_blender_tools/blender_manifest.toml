schema_version = "1.0.0"

id = "bob_blender_tools"
version = "0.1.0"
name = "BobBlenderTools"
tagline = "Bob procedural suite: MCP bridge, heightfield terrain, scatter"
maintainer = "Siva <sivasubramanyam@mayhem-studios.com>"
type = "add-on"

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]
tags = ["Pipeline", "Development"]

# The Bob procedural suite in Blender: World, Biome, Terrain, Paths, Scatter, Shaders,
# Atmosphere, and a collapsed Advanced/MCP-bridge panel, all in one BobBlenderTools tab.
# Self-contained (P0-P2): the builders (core/), panels (ui/), live bridge (bridge/), and the
# terrain compute (core/heightfields/) all live inside this folder, imported relatively, so the
# folder is the shippable product. Dev-install by symlinking it into Blender's extensions dir
# (`bob-setup`); ship by building the zip (tools/scripts/build_extension.py).

# Declared up front so Blender 5.2 does not restrict them at runtime (it flags undeclared use).
[permissions]
network = "Local MCP bridge socket and compute-wheel downloads (scipy/CuPy)"
files = "Read asset packs, write terrain bakes, install compute wheels"

# Keep caches and dev-only cruft out of the shipped zip.
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  ".*",
]
