name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + venv tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Self-import guard (no absolute self-imports in the extension)
        run: python tools/scripts/check_selfimports.py

      - name: Phase-label guard (identifiers describe features, not build phases)
        run: python tools/scripts/check_no_phase_labels.py

      - name: Scene-name guard (evidence names its asset class, not a throwaway scene)
        run: python tools/scripts/check_no_scene_names.py

      # --extra gpu is intentionally omitted: cupy-cuda13x needs a CUDA runtime the
      # runner lacks, and the GPU tests skip themselves when cupy is unimportable.
      - name: Unit tests
        run: uv run --with pytest --extra all --project tools pytest tools/tests -q

  # In-Blender geometry tests, against the ONLY supported target, Blender 5.2.
  # Everything in tools/tests runs in the plain venv against the pure-python core,
  # which is what lets the fast gate above stay honest without Blender -- and it
  # meant no geometry assertion ran in CI at all. tools/tests/run_blender_tests.py
  # drives the bpy-only gates (85 checks, about 6 s of Blender) and owns which ones
  # qualify. A separate job so the fast gate is never blocked on the heavy download.
  blender-headless:
    name: Blender 5.2 headless geometry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Fetch Blender 5.2
        run: |
          set -euo pipefail
          BLENDER_URL="https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz"
          mkdir -p "$HOME/blender"
          curl -fsSL "$BLENDER_URL" | tar -xJ -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"
      - name: Run headless geometry tests
        run: blender --background --python tools/tests/run_blender_tests.py
