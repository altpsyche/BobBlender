[project]
name = "bobtools"
version = "0.1.0"
description = "Integrations and automation for the BobBlender repo: MCP server, ComfyUI bridge, batch workflows"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

# Install only what a given workflow needs:
#   pip install -e '.[mcp]'      # MCP server
#   pip install -e '.[all]'
# There is no [comfyui] extra: the ComfyUI client is stdlib only and lives inside the extension
# so Blender's bundled Python can run it too (docs/COMFYUI.md, Bob-side constraint 1).
# `bobtools.comfyui` re-exports it.
[project.optional-dependencies]
mcp = ["mcp>=1.2"]
terrain = ["numpy>=1.26", "scipy>=1.11"]
all = ["mcp>=1.2", "numpy>=1.26", "scipy>=1.11"]
gpu = [
    "cupy-cuda13x>=14.1.1",
]

[project.scripts]
bob-new-project = "bobtools.scaffold:main"
bob-mcp = "bobtools.mcp_launch:main"
bob-setup = "bobtools.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
